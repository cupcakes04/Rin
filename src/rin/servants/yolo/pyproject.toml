# The YOLO job's own environment (D-07): job.py runs here, the caller in the core env.
# Created on the first `yolo.train` call, or by hand: uv sync --project src/rin/servants/yolo
[project]
name = "rin-yolo-job"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ultralytics>=8.4.58",    # YOLO26 support; v1 ran 8.4.58
    "torch==2.14.1",          # the CUDA 13.0 build, from the index below (same as the other jobs)
    "torchvision==0.29.1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
